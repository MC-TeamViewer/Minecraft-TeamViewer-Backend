# 服务端状态运行配置
# 所有数值都在服务端启动时加载；未配置项会回退到代码默认值。

[timeouts]
# 玩家对象无新上报时的超时时间（秒）
playerTimeoutSec = 120
# 实体对象无新上报时的超时时间（秒）
entityTimeoutSec = 300
# 路标对象基础超时时间（秒）；路标可被 payload.ttlSeconds 覆盖
waypointTimeoutSec = 60
# 战局区块活跃来源超时时间（秒）
battleChunkTimeoutSec = 120
# 战局区块服务端缓存保留时间（秒）
battleChunkCacheRetentionSec = 7200
# 每个房间最多保留的战局区块数量；达到时间或数量任一上限即淘汰最老记录
battleChunkCacheMaxEntries = 65536

[refreshRequest]
# 同一来源两次 refresh_req 的最小间隔（秒）
cooldownSec = 1.5
# 预过期窗口：remaining <= leadSec 时触发 refresh_req（秒）
leadSec = 1.2
# 单次 refresh_req 每个 scope 最多携带对象数量
maxItemsPerScope = 64

[protocol]
# digest 下发间隔（秒）
digestIntervalSec = 10
# 默认广播频率（Hz）
defaultBroadcastHz = 20.0
# 广播频率下限（Hz）
minBroadcastHz = 2.0
# Tab 玩家列表报告超时（秒）
tabReportTimeoutSec = 45
# 拥塞级别：[[连接数阈值, 降级广播Hz], ...]
# 建议按阈值从大到小写（代码会自动排序）
congestionLevels = [
  [40, 2.0],
  [20, 5.0],
  [8, 10.0],
]

[features]
# 是否启用同服过滤（基于 Tab 列表归并来源）
sameServerFilterEnabled = false

[tabHistory]
# 仅协议 0.7.0+ 且具有合法 UUID 的 Tab 条目会进入历史记录。
enabled = true
# 玩家最新标签保留天数；0 表示永久保留。
retentionDays = 400
# 增量变更日志保留天数；0 表示永久保留。
deltaRetentionDays = 30
# 下列条目数均是单消息 chunk 限制，不是房间记录总数限制。
defaultChunkEntries = 256
maxChunkEntries = 512
maxChunkBytes = 262144
maxLookupSelectors = 128
# 标签不变时，最多每隔多久刷新一次 lastObserved，避免高频 Tab 报告制造无意义增量。
observationUpdateIntervalSec = 300

[package]
name = "teamviewrelay-rust"
version = "1.2.0-alpha.6"
edition = "2024"
publish = false

[features]
default = []
memory-debug = [
    "dep:jemalloc_pprof",
    "dep:libc",
    "dep:mappings",
    "dep:pprof",
    "dep:pprof_util",
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemallocator",
]

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
http-body-util = "0.1"
ipnet = "2.11"
jemalloc_pprof = { version = "0.9", optional = true, features = ["flamegraph", "symbolize"] }
libc = { version = "0.2", optional = true }
mappings = { version = "0.7", optional = true }
mime_guess = "2.0"
pprof = { version = "0.15", optional = true, default-features = false, features = ["flamegraph", "frame-pointer", "protobuf-codec"] }
pprof_util = { version = "0.8", optional = true, features = ["flamegraph", "symbolize"] }
prost = "0.14"
zstd = "0.13"
zstd-safe = "7"
quinn = { version = "0.11.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.47", features = ["full", "test-util"] }
tikv-jemalloc-ctl = { version = "0.7", optional = true, features = ["profiling", "stats", "use_std"] }
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "stats"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }
unicode-normalization = "0.1"
url = "2.5"
yawc = { version = "0.3.4", default-features = false, features = ["axum"] }
wtransport = "0.7.2"
rustls-pemfile = "2.2.0"
x509-parser = "0.18.1"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dev-dependencies]
proptest = "1.7"

[profile.memory-debug]
inherits = "release"
debug = 1
strip = "none"

[[example]]
name = "gencert-wt"
path = "examples/gencert_wt.rs"

[[example]]
name = "quic-smoke"
path = "examples/quic_smoke.rs"

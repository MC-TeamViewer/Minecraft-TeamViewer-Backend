services:
  backend-rust:
    image: ${TEAMVIEWER_RUST_IMAGE:-ghcr.io/mc-teamviewer/minecraft-teamviewer-backend-rust:v1.0.1-proto0.7.0}
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: teamviewer-backend-rust
    restart: unless-stopped
    ports:
      - "${TEAMVIEWER_RUST_PORT:-8766}:8765"
    environment:
      RUST_LOG: ${TEAMVIEWER_LOG_LEVEL:-info}
      TEAMVIEWER_ADMIN_USERNAME: ${TEAMVIEWER_ADMIN_USERNAME:-admin}
      TEAMVIEWER_ADMIN_PASSWORD: ${TEAMVIEWER_ADMIN_PASSWORD:-change-me}
      TEAMVIEWER_ADMIN_SESSION_TTL_SEC: ${TEAMVIEWER_ADMIN_SESSION_TTL_SEC:-43200}
      TEAMVIEWER_TRUST_PROXY_HEADERS: ${TEAMVIEWER_TRUST_PROXY_HEADERS:-true}
      TEAMVIEWER_TRUSTED_PROXY_CIDRS: "${TEAMVIEWER_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}"
      TEAMVIEWER_AUDIT_RETENTION_DAYS: ${TEAMVIEWER_AUDIT_RETENTION_DAYS:-90}
      TEAMVIEWER_HOURLY_RETENTION_DAYS: ${TEAMVIEWER_HOURLY_RETENTION_DAYS:-90}
      TEAMVIEWER_DAILY_RETENTION_DAYS: ${TEAMVIEWER_DAILY_RETENTION_DAYS:-400}
      TEAMVIEWER_DB_PATH: /app/data/teamviewer-admin.db
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data-rust:/app/data

services:
  backend:
    image: ${TEAMVIEWER_IMAGE:-professornuo/teamviewrelay-rust:v1.2.0-alpha.2-proto0.8.0}
    build:
      context: .
    container_name: teamviewer-backend
    restart: unless-stopped
    ports:
      - "${TEAMVIEWER_PORT:-8765}:8765/tcp"
      - "${TEAMVIEWER_WT_PORT:-8766}:8766/udp"
    environment:
      RUST_LOG: ${TEAMVIEWER_LOG_LEVEL:-info}
      TEAMVIEWER_ADMIN_USERNAME: ${TEAMVIEWER_ADMIN_USERNAME:-admin}
      TEAMVIEWER_ADMIN_PASSWORD: ${TEAMVIEWER_ADMIN_PASSWORD:-change-me}
      TEAMVIEWER_ADMIN_SESSION_TTL_SEC: ${TEAMVIEWER_ADMIN_SESSION_TTL_SEC:-43200}
      TEAMVIEWER_DB_PATH: /app/data/teamviewer-admin.db
      TEAMVIEWER_TRUST_PROXY_HEADERS: ${TEAMVIEWER_TRUST_PROXY_HEADERS:-true}
      TEAMVIEWER_TRUSTED_PROXY_CIDRS: "${TEAMVIEWER_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}"
      TEAMVIEWER_WT_ENABLED: "${TEAMVIEWER_WT_ENABLED:-false}"
      TEAMVIEWER_WT_BIND: "${TEAMVIEWER_WT_BIND:-0.0.0.0:8766}"
      TEAMVIEWER_WT_CERT_PATH: "${TEAMVIEWER_WT_CERT_PATH:-}"
      TEAMVIEWER_WT_KEY_PATH: "${TEAMVIEWER_WT_KEY_PATH:-}"
      TEAMVIEWER_WT_IDENTITIES: "${TEAMVIEWER_WT_IDENTITIES:-}"
      TEAMVIEWER_WT_POLL_INTERVAL_SEC: "${TEAMVIEWER_WT_POLL_INTERVAL_SEC:-}"
      TEAMVIEWER_WT_RENEW_WINDOW_SEC: "${TEAMVIEWER_WT_RENEW_WINDOW_SEC:-}"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data-rust:/app/data
      - ${TEAMVIEWER_WT_CERT_HOST_PATH:-./certs}:/app/certs:ro

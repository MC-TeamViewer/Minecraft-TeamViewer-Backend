services:
  backend:
    image: ${TEAMVIEWER_DEBUG_IMAGE:-professornuo/teamviewrelay-rust:v1.1.2-memory-debug-proto0.8.0}
    build:
      target: memory-debug
    environment:
      TEAMVIEWER_DEBUG_DIR: /app/data/memory-debug
      TEAMVIEWER_DEBUG_SAMPLE_INTERVAL_SEC: ${TEAMVIEWER_DEBUG_SAMPLE_INTERVAL_SEC:-10}
      TEAMVIEWER_DEBUG_AUTO_CPU_PROFILE: ${TEAMVIEWER_DEBUG_AUTO_CPU_PROFILE:-false}
      TEAMVIEWER_DEBUG_CPU_TRIGGER_PERCENT: ${TEAMVIEWER_DEBUG_CPU_TRIGGER_PERCENT:-20}
      TEAMVIEWER_DEBUG_CPU_TRIGGER_SAMPLES: ${TEAMVIEWER_DEBUG_CPU_TRIGGER_SAMPLES:-3}
      TEAMVIEWER_DEBUG_CPU_PROFILE_SEC: ${TEAMVIEWER_DEBUG_CPU_PROFILE_SEC:-30}
      TEAMVIEWER_DEBUG_STARTUP_PROFILE_DELAY_SEC: ${TEAMVIEWER_DEBUG_STARTUP_PROFILE_DELAY_SEC:-120}
      TEAMVIEWER_DEBUG_MEMORY_GROWTH_MIB: ${TEAMVIEWER_DEBUG_MEMORY_GROWTH_MIB:-8}
      TEAMVIEWER_DEBUG_PERIODIC_PROFILE_SEC: ${TEAMVIEWER_DEBUG_PERIODIC_PROFILE_SEC:-3600}
      TEAMVIEWER_DEBUG_PROFILE_COOLDOWN_SEC: ${TEAMVIEWER_DEBUG_PROFILE_COOLDOWN_SEC:-1800}
      TEAMVIEWER_DEBUG_RETENTION_DAYS: ${TEAMVIEWER_DEBUG_RETENTION_DAYS:-7}
      TEAMVIEWER_DEBUG_MAX_PROFILES: ${TEAMVIEWER_DEBUG_MAX_PROFILES:-48}
      TEAMVIEWER_DEBUG_MAX_DISK_MIB: ${TEAMVIEWER_DEBUG_MAX_DISK_MIB:-512}

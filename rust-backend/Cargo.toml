[package]
name = "teamviewrelay-rust"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
http-body-util = "0.1"
ipnet = "2.11"
mime_guess = "2.0"
prost = "0.14"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.47", features = ["full", "test-util"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }
unicode-normalization = "0.1"
yawc = { version = "0.3.4", default-features = false, features = ["axum"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dev-dependencies]
proptest = "1.7"
